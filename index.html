<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Happy Valentine’s ❤️</title>
    <style>
      body { font-family: system-ui, Arial; display:flex; min-height:100vh; margin:0; align-items:center; justify-content:center; background:#fff0f6; }
      .card { background:white; padding:24px; border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.12); text-align:center; max-width:520px; }
      a { display:inline-block; margin-top:14px; padding:12px 16px; border-radius:12px; text-decoration:none; background:#ff4d6d; color:white; font-weight:700; }
      p { margin:10px 0 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Happy Valentine’s ❤️</h1>
      <p>I made something for you 😊</p>
      <a href="https://tinyurl.com/2u7sv4wc" target="_blank" rel="noopener">Open your surprise</a>
      <p style="font-size:13px;opacity:.7;">If the button doesn’t work: https://tinyurl.com/2u7sv4wc</p>
    </div>
  </body>
</html>
